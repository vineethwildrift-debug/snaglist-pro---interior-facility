# ---------------------------------------------------------------------------
# Licensing (Option A: offline-verifiable Ed25519 signed tokens)
#
# The application ships with the OWNER'S PUBLIC KEY only. The private key
# stays on the owner's machine and is used solely by the issuer CLI
# (`python -m snaglist_pro.licensing`). A license token is a signed JSON
# envelope verified against the embedded public key, so it cannot be forged
# without the private key.
#
#   1. Owner generates a keypair:
#        python -m snaglist_pro.licensing gen-keypair \
#            --private license.priv --public license.pub
#   2. Owner issues a token for a customer (valid for --lease-days, default 30):
#        python -m snaglist_pro.licensing issue \
#            --license-id LIC-001 --customer "Acme Corp" --edition Pro \
#            --features "pro,excel,google_sheets" \
#            --private license.priv --output LIC-001.lic
#   3. Operator installs the token on the customer's machine:
#        copy LIC-001.lic into the license directory, then run with
#        --license-check. The token is stored in the OS credential store.
#
# The client re-validates on every run, defends against clock rollback with a
# monotonic watermark, allows a 7-day offline grace window, and locks new
# report generation when the license expires. Reading or exporting
# already-produced data is never gated.
# ---------------------------------------------------------------------------

licensing:
  # Path to the owner's PUBLIC key shipped with the client.
  public_key: ""
  # Directory holding the installed token, watermark and attempt state.
  state_dir: ""
  # Token validity in days (lease). Short leases make revocation effective
  # within one cycle.
  lease_days: 30
  # How long a valid token may be used without re-validation before
  # generation is locked.
  grace_days: 7
  # Maximum activations per license.
  max_activations: 2
  # Feature tags included in the license (empty = no feature restrictions).
  features: []
