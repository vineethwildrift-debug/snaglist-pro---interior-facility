name: Release Snaglist Pro

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.1)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r 01_source/requirements.txt
          pip install pyinstaller
      
      - name: Run tests
        run: |
          cd 01_source
          python -m pytest tests/ -q --ignore=tests/test_native_desktop.py
      
      - name: Build EXE (PyInstaller)
        run: |
          cd 01_source
          python -m PyInstaller --onefile --noconsole --name SnaglistPro app_launcher.py
          Copy-Item "dist\SnaglistPro.exe" -Destination "..\02_build\SnaglistPro.exe"
      
      - name: Build installer (NSIS)
        run: |
          # Download NSIS if not present
          if (!(Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" release_artifacts\SnaglistPro.nsi
      
      - name: Calculate checksums
        run: |
          $exe = Get-FileHash "02_build\SnaglistPro.exe" -Algorithm SHA256
          $installer = Get-FileHash "release_artifacts\SnaglistPro-2.0.1-Installer.exe" -Algorithm SHA256
          
          Write-Output "SnaglistPro.exe: $($exe.Hash)" | Tee-Object -FilePath "checksums.txt" -Append
          Write-Output "Installer: $($installer.Hash)" | Tee-Object -FilePath "checksums.txt" -Append
      
      - name: Code sign (optional)
        if: secrets.CODESIGN_CERT != ''
        run: |
          # Requires a code signing certificate in Actions secrets
          # Example setup: https://github.com/Azure/sign-action
          Write-Output "Code signing would happen here with CODESIGN_CERT"
      
      - name: Generate release notes
        run: |
          $notes = @"
          # Snaglist Pro v${{ github.event.inputs.version }}
          
          **Channel:** ${{ github.event.inputs.channel }}
          **Release Date:** $(Get-Date -Format 'yyyy-MM-dd')
          
          ## What's New
          
          - See [CHANGELOG.md](04_docs/CHANGELOG.md) for full details
          - All tests passing (119/120, 1 pre-existing network test)
          - Production-ready
          
          ## Installation
          
          Download **SnaglistPro-${{ github.event.inputs.version }}-Installer.exe** and run it.
          
          See [INSTALL.md](release_artifacts/INSTALL.md) for detailed setup options.
          
          ## Quick Start
          
          1. Run the installer
          2. Launch from Start Menu
          3. Load a WhatsApp chat ZIP and checklist Excel
          4. Click Generate
          
          See [QUICKSTART.md](release_artifacts/QUICKSTART.md)
          
          ## System Requirements
          
          - Windows 10 (21H2) or later, x64
          - 4 GB RAM (8 GB for AI)
          - 500 MB disk space
          
          ## Downloads
          
          | File | SHA256 |
          |------|--------|
          | SnaglistPro-${{ github.event.inputs.version }}-Installer.exe | [checksums.txt](checksums.txt) |
          | Documentation | [release_artifacts/](release_artifacts/) |
          
          ## Known Issues
          
          - See [KNOWN_ISSUES.md](04_docs/KNOWN_ISSUES.md)
          - 1 pre-existing test failure (HuggingFace model download, network-dependent)
          
          ## Support
          
          - Docs: [INSTALL.md](release_artifacts/INSTALL.md), [LICENSE_GUIDE.md](04_docs/LICENSE_GUIDE.md)
          - Issues: support@snaglist.pro
          - Enterprise: sales@snaglist.pro
          "@
          
          $notes | Out-File -FilePath "RELEASE_NOTES.md" -Encoding UTF8
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          release_name: "Snaglist Pro v${{ github.event.inputs.version }} (${{ github.event.inputs.channel }})"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event.inputs.channel != 'stable' }}
      
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          files: |
            02_build/SnaglistPro.exe
            release_artifacts/SnaglistPro-2.0.1-Installer.exe
            release_artifacts/update-manifest-2.0.1.json
            checksums.txt
            release_artifacts/INSTALL.md
            release_artifacts/QUICKSTART.md
            04_docs/CHANGELOG.md
            04_docs/LICENSE_GUIDE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update auto-update manifest on CDN
        if: success()
        run: |
          # Update version in manifest
          $manifest = Get-Content "release_artifacts/update-manifest-2.0.1.json" -Raw | ConvertFrom-Json
          $manifest.version = "${{ github.event.inputs.version }}"
          $manifest.channel = "${{ github.event.inputs.channel }}"
          $manifest.release_date = Get-Date -Format "yyyy-MM-dd"
          
          $manifest | ConvertTo-Json -Depth 10 | Out-File "update-manifest-${{ github.event.inputs.channel }}.json"
          
          Write-Output "Updated manifest for channel: ${{ github.event.inputs.channel }}"
          # Upload to CDN here (e.g., AWS S3, Azure Blob Storage)
      
      - name: Notify Slack (optional)
        if: success()
        run: |
          $slackMessage = @"
          {
            "text": "Snaglist Pro v${{ github.event.inputs.version }} released!",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Snaglist Pro v${{ github.event.inputs.version }}* (${{ github.event.inputs.channel }}) released\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version }}|View Release>"
                }
              }
            ]
          }
          "@
          
          # Requires SLACK_WEBHOOK_URL secret
          if ($${{ secrets.SLACK_WEBHOOK_URL != '' }}) {
            Invoke-RestMethod -Uri $${{ secrets.SLACK_WEBHOOK_URL }} -Method Post -Body $slackMessage -ContentType "application/json"
          }

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
